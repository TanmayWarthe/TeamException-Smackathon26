<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=340" />
  <title>CTIP — Campus Threat Intelligence</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="ctip-popup">

    <!-- Header -->
    <header class="ctip-header">
      <div class="ctip-logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2l7 4v5c0 5.25-3.5 9.74-7 11-3.5-1.26-7-5.75-7-11V6l7-4z"/>
        </svg>
      </div>
      <div>
        <h1 class="ctip-title">CTIP</h1>
        <p class="ctip-subtitle">Campus Threat Intelligence</p>
      </div>
    </header>

    <!-- Domain Info -->
    <section class="ctip-domain-section">
      <p class="ctip-section-label">Current Site</p>
      <p class="ctip-domain" id="current-domain">—</p>
      <p class="ctip-url" id="current-url">—</p>
    </section>

    <!-- Risk Display -->
    <section class="ctip-risk-section" id="risk-section">
      <!-- Filled dynamically -->
    </section>

    <!-- Footer -->
    <footer class="ctip-footer">
      <span id="last-analysis">—</span>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>
</html>
